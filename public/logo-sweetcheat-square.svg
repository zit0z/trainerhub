<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0c10;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161922;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a8cc;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bgGrad)" rx="48" ry="48" />

  <g transform="translate(126, 140)" filter="url(#glow)">
    <rect x="0" y="40" width="260" height="140" rx="60" ry="60" fill="url(#cyanGrad)" />
    <ellipse cx="45" cy="145" rx="42" ry="52" fill="url(#cyanGrad)" />
    <ellipse cx="215" cy="145" rx="42" ry="52" fill="url(#cyanGrad)" />

    <g fill="#0b0c10">
      <rect x="48" y="82" width="16" height="50" rx="4" />
      <rect x="36" y="96" width="40" height="16" rx="4" />
    </g>

    <circle cx="185" cy="82" r="12" fill="#7c3aed" />
    <circle cx="216" cy="113" r="12" fill="#2ed573" />
    <circle cx="154" cy="113" r="12" fill="#ff4757" />
    <circle cx="185" cy="144" r="12" fill="#ffa502" />

    <rect x="32" y="30" width="55" height="26" rx="10" fill="#00a8cc" />
    <rect x="175" y="30" width="55" height="26" rx="10" fill="#00a8cc" />
  </g>

  <text x="256" y="380" text-anchor="middle" font-family="'Rajdhani', 'Arial Black', sans-serif" font-size="52" font-weight="700" letter-spacing="1">
    <tspan fill="#ffffff">Sweet</tspan><tspan fill="url(#cyanGrad)" filter="url(#glow)">Cheat</tspan>
  </text>
</svg>
