<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freunde — SweetCheat</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="shared-modern.css">
    <script defer src="components/header-menu.js"></script>
    <script defer src="shared.js"></script>
    <style>
        .friend-card { display:flex; align-items:center; gap:16px; padding:16px; background:var(--bg-card); border:1px solid var(--border); border-radius:12px; margin-bottom:12px; }
        .friend-avatar { width:50px; height:50px; border-radius:999px; background:var(--bg-elevated); display:flex; align-items:center; justify-content:center; color:var(--accent); font-size:1.5rem; }
        .friend-info { flex:1; }
        .friend-name { font-weight:600; }
        .friend-status { font-size:0.8rem; color:var(--text-muted); }
        .friend-actions { display:flex; gap:8px; }
        .search-box { display:flex; gap:10px; margin-bottom:20px; }
        .search-box input { flex:1; }
        .request-card { display:flex; align-items:center; gap:16px; padding:12px; background:var(--bg-card); border:1px solid var(--border); border-radius:10px; margin-bottom:10px; }
    </style>
</head>
<body>
    <button class="mobile-toggle" onclick="toggleMobileNav()"><i class="fas fa-bars"></i></button>
    <aside class="nav-sidebar">
        <div style="padding:18px; border-bottom:1px solid var(--border);">
            <a href="/trainerhub/"><img src="/trainerhub/logo-sweetcheat-header.png" alt="SweetCheat" style="height:40px; width:auto; max-width:200px; object-fit:contain; display:block;"></a>
        </div>
        <div class="nav-main">
            <a href="dashboard" class="nav-item"><span class="icon"><i class="fas fa-th-large"></i></span> Dashboard</a>
            <a href="games" class="nav-item"><span class="icon"><i class="fas fa-gamepad"></i></span> Spiele</a>
            <a href="trainers" class="nav-item"><span class="icon"><i class="fas fa-crosshairs"></i></span> Trainer</a>
            <a href="favorites" class="nav-item"><span class="icon"><i class="fas fa-star"></i></span> Favoriten</a>
            <a href="challenges" class="nav-item"><span class="icon"><i class="fas fa-trophy"></i></span> Challenges</a>
            <a href="leaderboard" class="nav-item"><span class="icon"><i class="fas fa-chart-bar"></i></span> Rangliste</a>
            <a href="friends" class="nav-item active logged-in-only"><span class="icon"><i class="fas fa-user-friends"></i></span> Freunde</a>
            <a href="forum" class="nav-item logged-in-only"><span class="icon"><i class="fas fa-comments"></i></span> Forum</a>
            <a href="achievements" class="nav-item logged-in-only"><span class="icon"><i class="fas fa-medal"></i></span> Erfolge</a>
            <a href="profile" class="nav-item"><span class="icon"><i class="fas fa-user"></i></span> Profil</a>
            <a href="settings" class="nav-item"><span class="icon"><i class="fas fa-cog"></i></span> Einstellungen</a>
        </div>
    </aside>

    <div class="page-content">
        <div class="topbar">
            <h1 class="section-title" style="font-size:26px;">Freunde</h1>
            <div id="headerUserMenu" style="display:flex; gap:10px;">
                <a href="login" class="btn btn-secondary btn-sm">Login</a>
                <a href="register" class="btn btn-primary btn-sm">Registrieren</a>
            </div>
        </div>

        <div style="padding:28px;">
            <div class="card" style="padding:24px; margin-bottom:24px;">
                <h3 style="margin:0 0 16px; font-family:'Rajdhani',sans-serif; text-transform:uppercase;">Freund suchen</h3>
                <div class="search-box">
                    <input type="text" id="friendSearch" placeholder="Benutzernamen eingeben..." oninput="searchUsers(this)">
                </div>
                <div id="searchResults"></div>
            </div>

            <div class="grid-2">
                <div class="card" style="padding:24px;">
                    <h3 style="margin:0 0 16px; font-family:'Rajdhani',sans-serif; text-transform:uppercase;">Freunde</h3>
                    <div id="friendsList">
                        <div class="empty">Lade Freunde...</div>
                    </div>
                </div>

                <div class="card" style="padding:24px;">
                    <h3 style="margin:0 0 16px; font-family:'Rajdhani',sans-serif; text-transform:uppercase;">Anfragen</h3>
                    <div id="requestsList">
                        <div class="empty">Lade Anfragen...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = '/trainerhub/api/friends.php';
        let token = localStorage.getItem('trainerhub_api_key');

        document.addEventListener('DOMContentLoaded', () => {
            if (!token) { window.location.href = '/trainerhub/login?redirect=/trainerhub/friends'; return; }
            loadFriends();
        });

        async function loadFriends() {
            const res = await fetch(API + '?action=list', { headers: { 'Authorization': 'Bearer ' + token } });
            const data = await res.json();
            const friendsContainer = document.getElementById('friendsList');
            const requestsContainer = document.getElementById('requestsList');
            if (!data.success) { friendsContainer.innerHTML = '<div class="empty">Fehler</div>'; return; }

            const accepted = data.friends.filter(f => f.status === 'accepted');
            const pending = data.friends.filter(f => f.status === 'pending');

            friendsContainer.innerHTML = accepted.length ? accepted.map(f => `
                <div class="friend-card">
                    <div class="friend-avatar"><i class="fas fa-user"></i></div>
                    <div class="friend-info">
                        <div class="friend-name">${escapeHtml(f.username)}</div>
                        <div class="friend-status">Reputation: ${f.reputation || 0} ${f.is_admin ? '• ADMIN' : ''}</div>
                    </div>
                    <div class="friend-actions">
                        <button class="btn btn-secondary btn-sm" onclick="removeFriend(${f.id})">Entfernen</button>
                    </div>
                </div>
            `).join('') : '<div class="empty">Noch keine Freunde</div>';

            requestsContainer.innerHTML = pending.length ? pending.map(f => `
                <div class="request-card">
                    <div class="friend-avatar"><i class="fas fa-user"></i></div>
                    <div class="friend-info">
                        <div class="friend-name">${escapeHtml(f.username)}</div>
                        <div class="friend-status">${f.direction === 'incoming' ? 'Möchte dein Freund sein' : 'Anfrage gesendet'}</div>
                    </div>
                    <div class="friend-actions">
                        ${f.direction === 'incoming' ? `
                            <button class="btn btn-primary btn-sm" onclick="respond(${f.id}, 'accepted')">Annehmen</button>
                            <button class="btn btn-secondary btn-sm" onclick="respond(${f.id}, 'rejected')">Ablehnen</button>
                        ` : `<span style="color:var(--text-muted);">Wartet...</span>
                        `}
                    </div>
                </div>
            `).join('') : '<div class="empty">Keine offenen Anfragen</div>';
        }

        let searchTimeout;
        function searchUsers(input) {
            clearTimeout(searchTimeout);
            const q = input.value.trim();
            const container = document.getElementById('searchResults');
            if (q.length < 2) { container.innerHTML = ''; return; }
            searchTimeout = setTimeout(async () => {
                const res = await fetch(API + '?action=search&q=' + encodeURIComponent(q), { headers: { 'Authorization': 'Bearer ' + token } });
                const data = await res.json();
                if (!data.success || !data.users.length) { container.innerHTML = '<div class="empty" style="padding:12px;">Keine Treffer</div>'; return; }
                container.innerHTML = data.users.map(u => `
                    <div class="request-card">
                        <div class="friend-avatar"><i class="fas fa-user"></i></div>
                        <div class="friend-info">
                            <div class="friend-name">${escapeHtml(u.username)}</div>
                            <div class="friend-status">Reputation: ${u.reputation || 0}</div>
                        </div>
                        <button class="btn btn-primary btn-sm" onclick="sendRequest(${u.id})">Hinzufügen</button>
                    </div>
                `).join('');
            }, 300);
        }

        async function sendRequest(userId) {
            await fetch(API + '?action=request', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId })
            });
            showToast('Freundschaftsanfrage gesendet', 'success');
            loadFriends();
        }

        async function respond(userId, status) {
            await fetch(API + '?action=respond', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, status })
            });
            showToast(status === 'accepted' ? 'Freundschaft angenommen' : 'Anfrage abgelehnt', 'info');
            loadFriends();
        }

        async function removeFriend(userId) {
            await fetch(API + '?action=remove&user_id=' + userId, { headers: { 'Authorization': 'Bearer ' + token } });
            loadFriends();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>

<div id="chatWidget" class="chat-widget" style="position:fixed; bottom:90px; right:20px; width:340px; max-height:450px; background:var(--bg-card); border:1px solid var(--border); border-radius:16px; display:none; flex-direction:column; overflow:hidden; z-index:9998; box-shadow:0 20px 60px rgba(0,0,0,0.5);">
    <div style="padding:14px 16px; background:var(--bg-elevated); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
        <div style="font-weight:600; font-family: Rajdhani;"><i class="fas fa-comments" style="color:var(--accent); margin-right:8px;"></i>Community Chat</div>
        <button onclick="toggleChat()" style="background:none; border:none; color:var(--text-muted); cursor:pointer;"><i class="fas fa-times"></i></button>
    </div>
    <div id="chatMessages" style="flex:1; overflow-y:auto; padding:12px; max-height:320px;">
        <div class="empty" style="text-align:center; color:var(--text-muted);">Lade Chat...</div>
    </div>
    <div style="padding:12px; border-top:1px solid var(--border); display:flex; gap:8px;">
        <input type="text" id="chatInput" placeholder="Nachricht..." onkeydown="if(event.key==='Enter') sendChat()" style="flex:1; padding:8px 12px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:8px; color:var(--text);">
        <button class="btn btn-primary btn-sm" onclick="sendChat()"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>
<button id="chatToggle" class="btn btn-primary" onclick="toggleChat()" style="position:fixed; bottom:20px; right:20px; width:54px; height:54px; border-radius:50%; z-index:9999; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(0,212,255,0.3);"><i class="fas fa-comments fa-lg"></i></button>


<script>
    const token = localStorage.getItem('trainerhub_api_key');
    let chatOpen = false;
    function toggleChat() {
        const w = document.getElementById('chatWidget');
        chatOpen = !chatOpen;
        w.style.display = chatOpen ? 'flex' : 'none';
        if (chatOpen) loadChat();
    }
    async function loadChat() {
        try {
            const res = await fetch('/trainerhub/api/chat.php?action=history');
            const data = await res.json();
            const container = document.getElementById('chatMessages');
            if (!data.success) { container.innerHTML = '<div class="empty" style="text-align:center; color:var(--text-muted);">Chat nicht verfügbar</div>'; return; }
            container.innerHTML = data.messages.map(m => `
                <div style="margin-bottom:8px;">
                    <span style="color:${m.is_admin ? 'var(--warning)' : 'var(--accent)'}; font-weight:600; font-size:0.85rem;">${m.username}</span>
                    <span style="color:var(--text-muted); font-size:0.75rem; margin-left:6px;">${new Date(m.created_at * 1000).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'})}</span>
                    <div style="color:var(--text); font-size:0.9rem; margin-top:2px;">${m.message}</div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        } catch(e) { console.error(e); }
    }
    async function sendChat() {
        if (!token) { showToast('Login erforderlich', 'warn'); return; }
        const input = document.getElementById('chatInput');
        const msg = input.value.trim();
        if (!msg) return;
        await fetch('/trainerhub/api/chat.php?action=send', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg })
        });
        input.value = '';
        loadChat();
    }
    setInterval(() => { if (chatOpen) loadChat(); }, 15000);
</script>
</body>
</html>
