<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenges — SweetCheat</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="shared-modern.css">
    <style>
        .challenge-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:24px; margin-bottom:16px; }
        .challenge-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
        .challenge-title { font-family:'Rajdhani',sans-serif; font-size:1.3rem; font-weight:600; }
        .challenge-desc { color:var(--text-muted); font-size:14px; line-height:1.6; margin-bottom:16px; }
        .progress-bar { height:8px; background:var(--border); border-radius:4px; overflow:hidden; }
        .progress-fill { height:100%; background:var(--accent); border-radius:4px; transition:width .3s; }
        .challenge-meta { display:flex; justify-content:space-between; margin-top:10px; font-size:13px; color:var(--text-muted); }
        .badge-complete { background:var(--success); color:#fff; padding:4px 12px; border-radius:999px; font-size:12px; font-weight:700; }
    </style>
</head>
<body>
    <header style="background:var(--bg-card); border-bottom:1px solid var(--border); padding:14px 20px;">
    <div style="max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center;">
        <a href="/trainerhub/"><img src="/trainerhub/logo-sweetcheat-header.png" alt="SweetCheat" style="height:42px; width:auto; max-width:260px; object-fit:contain; display:block;"></a>
        <nav style="display:flex; gap:24px; align-items:center;">
            <a href="/trainerhub/#features" style="color:var(--text-muted); text-decoration:none; font-size:14px;">Features</a>
            <a href="/trainerhub/#pricing" style="color:var(--text-muted); text-decoration:none; font-size:14px;">Preise</a>
            <a href="blog" style="color:var(--text-muted); text-decoration:none; font-size:14px;">Blog</a>
            <div id="headerUserMenu" style="display:flex; gap:10px;">
                <a href="login" class="btn btn-secondary btn-sm">Login</a>
                <a href="register" class="btn btn-primary btn-sm">Registrieren</a>
            </div>
        </nav>
    </div>
</header>

    <div style="max-width:1000px; margin:0 auto; padding:40px 20px;">
        <h1 style="font-family:'Rajdhani',sans-serif; font-size:2.2rem; margin-bottom:8px;">Challenges</h1>
        <p style="color:var(--text-muted); margin-bottom:30px;">Schließe Aufgaben ab und verdiene Premium-Tage.</p>
        <div id="challengesList">Lade...</div>
    </div>

    <footer style="background:var(--bg-card); border-top:1px solid var(--border); padding:30px; text-align:center; color:var(--text-muted); font-size:14px;">
        <p>© 2026 SweetCheat.</p>
    </footer>

    <script src="components/header-menu.js"></script>
    <script src="shared.js"></script>
    <script>
        async function loadChallenges() {
            const key = getApiKey();
            const headers = key ? {'Authorization':'Bearer '+key} : {};
            try {
                const res = await fetch('api/challenges.php?action=my', {headers});
                const data = await res.json();
                const list = document.getElementById('challengesList');
                if (!data.success || !data.challenges.length) {
                    list.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:40px;">Keine aktiven Challenges.</div>';
                    return;
                }
                list.innerHTML = data.challenges.map(c => {
                    const pct = Math.min(100, (c.progress || 0) / c.target * 100);
                    const done = c.completed;
                    return `
                        <div class="challenge-card">
                            <div class="challenge-header">
                                <div class="challenge-title">${escapeHtml(c.title)}</div>
                                ${done ? '<span class="badge-complete"><i class="fas fa-check"></i> Abgeschlossen</span>' : ''}
                            </div>
                            <div class="challenge-desc">${escapeHtml(c.description || '')}</div>
                            <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
                            <div class="challenge-meta">
                                <span>${c.progress || 0} / ${c.target}</span>
                                <span>Belohnung: ${c.reward_days || 0} Premium-Tage</span>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch(e) { console.error(e); }
        }
        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text || ''; return div.innerHTML; }
        loadChallenges();
    </script>

<div id="chatWidget" class="chat-widget" style="position:fixed; bottom:90px; right:20px; width:340px; max-height:450px; background:var(--bg-card); border:1px solid var(--border); border-radius:16px; display:none; flex-direction:column; overflow:hidden; z-index:9998; box-shadow:0 20px 60px rgba(0,0,0,0.5);">
    <div style="padding:14px 16px; background:var(--bg-elevated); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
        <div style="font-weight:600; font-family: Rajdhani;"><i class="fas fa-comments" style="color:var(--accent); margin-right:8px;"></i>Community Chat</div>
        <button onclick="toggleChat()" style="background:none; border:none; color:var(--text-muted); cursor:pointer;"><i class="fas fa-times"></i></button>
    </div>
    <div id="chatMessages" style="flex:1; overflow-y:auto; padding:12px; max-height:320px;">
        <div class="empty" style="text-align:center; color:var(--text-muted);">Lade Chat...</div>
    </div>
    <div style="padding:12px; border-top:1px solid var(--border); display:flex; gap:8px;">
        <input type="text" id="chatInput" placeholder="Nachricht..." onkeydown="if(event.key==='Enter') sendChat()" style="flex:1; padding:8px 12px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:8px; color:var(--text);">
        <button class="btn btn-primary btn-sm" onclick="sendChat()"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>
<button id="chatToggle" class="btn btn-primary" onclick="toggleChat()" style="position:fixed; bottom:20px; right:20px; width:54px; height:54px; border-radius:50%; z-index:9999; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(0,212,255,0.3);"><i class="fas fa-comments fa-lg"></i></button>


<script>
    const token = getApiKey();
    let chatOpen = false;
    function toggleChat() {
        const w = document.getElementById('chatWidget');
        chatOpen = !chatOpen;
        w.style.display = chatOpen ? 'flex' : 'none';
        if (chatOpen) loadChat();
    }
    async function loadChat() {
        try {
            const res = await fetch('/trainerhub/api/chat.php?action=history');
            const data = await res.json();
            const container = document.getElementById('chatMessages');
            if (!data.success) { container.innerHTML = '<div class="empty" style="text-align:center; color:var(--text-muted);">Chat nicht verfügbar</div>'; return; }
            container.innerHTML = data.messages.map(m => `
                <div style="margin-bottom:8px;">
                    <span style="color:${m.is_admin ? 'var(--warning)' : 'var(--accent)'}; font-weight:600; font-size:0.85rem;">${m.username}</span>
                    <span style="color:var(--text-muted); font-size:0.75rem; margin-left:6px;">${new Date(m.created_at * 1000).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'})}</span>
                    <div style="color:var(--text); font-size:0.9rem; margin-top:2px;">${m.message}</div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        } catch(e) { console.error(e); }
    }
    async function sendChat() {
        if (!token) { showToast('Login erforderlich', 'warn'); return; }
        const input = document.getElementById('chatInput');
        const msg = input.value.trim();
        if (!msg) return;
        await fetch('/trainerhub/api/chat.php?action=send', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg })
        });
        input.value = '';
        loadChat();
    }
    setInterval(() => { if (chatOpen) loadChat(); }, 15000);
</script>
</body>
</html>
