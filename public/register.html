<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrierung — SweetCheat Engine</title>
    <link rel="stylesheet" href="shared-modern.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: radial-gradient(circle at 50% 50%, #1a1f2e 0%, #0a0c12 100%); 
            margin: 0;
        }
        .register-card { 
            background: var(--bg-card); 
            border: 1px solid var(--border); 
            border-radius: 24px; 
            padding: 48px; 
            width: 100%; 
            max-width: 420px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
            text-align: center;
            transition: transform 0.3s ease;
        }
        .register-card:hover { transform: translateY(-5px); }
        .brand-logo { font-family: 'Rajdhani', sans-serif; font-size: 32px; font-weight: 700; color: var(--text); margin-bottom: 30px; display: block; text-decoration: none; }
        .brand-logo span { color: var(--accent); }
        h1 { font-family: 'Rajdhani', sans-serif; font-size: 28px; margin: 0 0 8px; }
        p { color: var(--text-muted); font-size: 15px; margin-bottom: 30px; }
        .field { text-align: left; margin-bottom: 20px; }
        .field label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .error-msg { color: var(--danger); font-size: 13px; margin-bottom: 15px; min-height: 18px; text-align: center; }
        .footer-links { margin-top: 25px; text-align: center; font-size: 14px; color: var(--text-muted); }
        .footer-links a { color: var(--accent); text-decoration: none; font-weight: 600; transition: 0.2s; }
        .footer-links a:hover { text-shadow: 0 0 10px var(--accent); }
    </style>
</head>
<body>
    <div class="register-card">
        <a href="/trainerhub/" class="brand-logo"><i class="fas fa-crosshairs"></i> Sweet<span>Cheat</span></a>
        <h1>Konto erstellen</h1>
        <p>Werde Teil der Elite. Hol dir den Vorsprung.</p>
        
        <div class="field">
            <label>E-Mail</label>
            <input type="email" id="regEmail" placeholder="name@email.de">
        </div>
        <div class="field">
            <label>Passwort</label>
            <input type="password" id="regPassword" placeholder="Mindestens 6 Zeichen">
        </div>
        
        <div id="error" class la="error-msg"></div>
        
        <button class="btn btn-gradient btn-full" onclick="doRegister()" style="width:100%; padding:14px; font-size:16px; cursor:pointer;">
            <i class="fas fa-user-plus"></i> Jetzt registrieren
        </button>
        
        <div class="footer-links">
            Bereits ein Konto? <a href="login">Hier einloggen</a>
        </div>
    </div>

    <script src="shared.js"></script>
    <script>
        async function doRegister() {
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const errEl = document.getElementById('error');
            errEl.textContent = '';
            try {
                const res = await fetch('api/auth.php?action=register', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({email, password})
                });
                const data = await res.json();
                if (!data.success) {
                    errEl.textContent = data.error || 'Registrierung fehlgeschlagen';
                    return;
                }
                localStorage.setItem('trainerhub_api_key', data.api_key);
                localStorage.setItem('sweetcheat_api_key', data.api_key);
                location.href = '/trainerhub/dashboard';
            } catch (e) {
                errEl.textContent = 'Netzwerkfehler';
            }
        }
        document.getElementById('regPassword').addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
    </script>
</body>
</html>
