<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wunschliste — SweetCheat</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="shared-modern.css">
    <script defer src="components/header-menu.js"></script>
    <script defer src="shared.js"></script>
    <style>
        .request-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
        .request-card:hover { border-color: var(--accent); }
        .request-title { font-weight: 600; font-size: 1.1rem; margin-bottom: 6px; }
        .request-meta { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 12px; }
        .request-actions { display: flex; gap: 10px; align-items: center; }
        .vote-btn { display: flex; align-items: center; gap: 6px; }
    </style>
</head>
<body>
    <button class="mobile-toggle" onclick="toggleMobileNav()"><i class="fas fa-bars"></i></button>
    <aside class="nav-sidebar">
        <div style="padding:18px; border-bottom:1px solid var(--border);">
            <a href="/trainerhub/"><img src="/trainerhub/logo-sweetcheat-header.png" alt="SweetCheat" style="height:42px; width:auto; max-width:260px; object-fit:contain; display:block;"></a>
        </div>
        <div class="nav-main">
            <a href="dashboard" class="nav-item"><span class="icon"><i class="fas fa-th-large"></i></span> Dashboard</a>
            <a href="games" class="nav-item"><span class="icon"><i class="fas fa-gamepad"></i></span> Spiele</a>
            <a href="trainers" class="nav-item"><span class="icon"><i class="fas fa-crosshairs"></i></span> Trainer</a>
            <a href="favorites" class="nav-item"><span class="icon"><i class="fas fa-star"></i></span> Favoriten</a>
            <a href="challenges" class="nav-item"><span class="icon"><i class="fas fa-trophy"></i></span> Challenges</a>
            <a href="leaderboard" class="nav-item"><span class="icon"><i class="fas fa-chart-bar"></i></span> Rangliste</a>
            <a href="friends" class="nav-item logged-in-only"><span class="icon"><i class="fas fa-user-friends"></i></span> Freunde</a>
            <a href="forum" class="nav-item logged-in-only"><span class="icon"><i class="fas fa-comments"></i></span> Forum</a>
            <a href="achievements" class="nav-item logged-in-only"><span class="icon"><i class="fas fa-medal"></i></span> Erfolge</a>
            <a href="marketplace" class="nav-item active logged-in-only"><span class="icon"><i class="fas fa-store"></i></span> Wunschliste</a>
            <a href="profile" class="nav-item"><span class="icon"><i class="fas fa-user"></i></span> Profil</a>
            <a href="settings" class="nav-item"><span class="icon"><i class="fas fa-cog"></i></span> Einstellungen</a>
        </div>
    </aside>

    <div class="page-content">
        <div class="topbar">
            <h1 class="section-title" style="font-size:26px;">Wunschliste</h1>
            <div id="headerUserMenu" style="display:flex; gap:10px;">
                <a href="login" class="btn btn-secondary btn-sm">Login</a>
                <a href="register" class="btn btn-primary btn-sm">Registrieren</a>
            </div>
        </div>

        <div style="padding:28px;">
            <div class="card" style="padding:24px; margin-bottom:24px;">
                <h3 style="margin:0 0 16px; font-family:'Rajdhani',sans-serif; text-transform:uppercase;">Neuen Trainer wünschen</h3>
                <input type="text" id="reqGame" placeholder="Spielname" style="width:100%; margin-bottom:10px; padding:10px; background:var(--bg-elevated); color:var(--text); border:1px solid var(--border); border-radius:8px;">
                <input type="text" id="reqType" placeholder="Art des Trainers (z. B. Geld, XP, Items)" style="width:100%; margin-bottom:10px; padding:10px; background:var(--bg-elevated); color:var(--text); border:1px solid var(--border); border-radius:8px;">
                <textarea id="reqDesc" placeholder="Beschreibung" style="width:100%; min-height:80px; margin-bottom:10px; background:var(--bg-elevated); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px;"></textarea>
                <button class="btn btn-primary" onclick="createRequest()">Wunsch einreichen</button>
            </div>

            <h3 style="margin:0 0 16px; font-family:'Rajdhani',sans-serif; text-transform:uppercase;">Top-Wünsche</h3>
            <div id="requestsList">
                <div class="empty">Lade Wünsche...</div>
            </div>
        </div>
    </div>

    <script>
        const token = getApiKey();
        if (!token) window.location.href = '/trainerhub/login?redirect=/trainerhub/marketplace';

        document.addEventListener('DOMContentLoaded', loadRequests);

        async function loadRequests() {
            const res = await fetch('/trainerhub/api/marketplace.php?action=list', { headers: { 'Authorization': 'Bearer ' + token } });
            const data = await res.json();
            const container = document.getElementById('requestsList');
            if (!data.success || !data.requests.length) { container.innerHTML = '<div class="empty">Noch keine Wünsche. Sei der Erste!</div>'; return; }
            container.innerHTML = data.requests.map(r => `
                <div class="request-card">
                    <div class="request-title">${r.game_name}</div>
                    <div class="request-meta">Von ${r.username} • ${r.trainer_type || 'Allgemein'} • ${new Date(r.created_at * 1000).toLocaleDateString('de-DE')}</div>
                    <p style="color:var(--text);">${r.description || ''}</p>
                    <div class="request-actions">
                        <button class="btn btn-secondary btn-sm vote-btn ${r.user_voted ? 'active' : ''}" onclick="vote(${r.id})">
                            <i class="fas fa-arrow-up"></i> ${r.vote_count || 0} Votes
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function createRequest() {
            const body = {
                game_name: document.getElementById('reqGame').value.trim(),
                trainer_type: document.getElementById('reqType').value.trim(),
                description: document.getElementById('reqDesc').value.trim()
            };
            if (!body.game_name) { alert('Spielname erforderlich'); return; }
            await fetch('/trainerhub/api/marketplace.php?action=create', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            document.getElementById('reqGame').value = '';
            document.getElementById('reqType').value = '';
            document.getElementById('reqDesc').value = '';
            showToast('Wunsch eingereicht', 'success');
            loadRequests();
        }

        async function vote(id) {
            await fetch('/trainerhub/api/marketplace.php?action=vote', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ request_id: id })
            });
            loadRequests();
        }
    </script>

<div id="chatWidget" class="chat-widget" style="position:fixed; bottom:90px; right:20px; width:340px; max-height:450px; background:var(--bg-card); border:1px solid var(--border); border-radius:16px; display:none; flex-direction:column; overflow:hidden; z-index:9998; box-shadow:0 20px 60px rgba(0,0,0,0.5);">
    <div style="padding:14px 16px; background:var(--bg-elevated); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
        <div style="font-weight:600; font-family: Rajdhani;"><i class="fas fa-comments" style="color:var(--accent); margin-right:8px;"></i>Community Chat</div>
        <button onclick="toggleChat()" style="background:none; border:none; color:var(--text-muted); cursor:pointer;"><i class="fas fa-times"></i></button>
    </div>
    <div id="chatMessages" style="flex:1; overflow-y:auto; padding:12px; max-height:320px;">
        <div class="empty" style="text-align:center; color:var(--text-muted);">Lade Chat...</div>
    </div>
    <div style="padding:12px; border-top:1px solid var(--border); display:flex; gap:8px;">
        <input type="text" id="chatInput" placeholder="Nachricht..." onkeydown="if(event.key==='Enter') sendChat()" style="flex:1; padding:8px 12px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:8px; color:var(--text);">
        <button class="btn btn-primary btn-sm" onclick="sendChat()"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>
<button id="chatToggle" class="btn btn-primary" onclick="toggleChat()" style="position:fixed; bottom:20px; right:20px; width:54px; height:54px; border-radius:50%; z-index:9999; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(0,212,255,0.3);"><i class="fas fa-comments fa-lg"></i></button>


<script>
    const token = getApiKey();
    let chatOpen = false;
    function toggleChat() {
        const w = document.getElementById('chatWidget');
        chatOpen = !chatOpen;
        w.style.display = chatOpen ? 'flex' : 'none';
        if (chatOpen) loadChat();
    }
    async function loadChat() {
        try {
            const res = await fetch('/trainerhub/api/chat.php?action=history');
            const data = await res.json();
            const container = document.getElementById('chatMessages');
            if (!data.success) { container.innerHTML = '<div class="empty" style="text-align:center; color:var(--text-muted);">Chat nicht verfügbar</div>'; return; }
            container.innerHTML = data.messages.map(m => `
                <div style="margin-bottom:8px;">
                    <span style="color:${m.is_admin ? 'var(--warning)' : 'var(--accent)'}; font-weight:600; font-size:0.85rem;">${m.username}</span>
                    <span style="color:var(--text-muted); font-size:0.75rem; margin-left:6px;">${new Date(m.created_at * 1000).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'})}</span>
                    <div style="color:var(--text); font-size:0.9rem; margin-top:2px;">${m.message}</div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        } catch(e) { console.error(e); }
    }
    async function sendChat() {
        if (!token) { showToast('Login erforderlich', 'warn'); return; }
        const input = document.getElementById('chatInput');
        const msg = input.value.trim();
        if (!msg) return;
        await fetch('/trainerhub/api/chat.php?action=send', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg })
        });
        input.value = '';
        loadChat();
    }
    setInterval(() => { if (chatOpen) loadChat(); }, 15000);
</script>
</body>
</html>
