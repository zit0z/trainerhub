<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog — SweetCheat</title>
    <meta name="description" content="Neuigkeiten, Cheats, Guides und Updates rund um SweetCheat und Singleplayer-Trainer.">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="shared-modern.css">
    <style>
        .blog-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:24px; }
        .blog-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:24px; transition:all .2s; }
        .blog-card:hover { border-color:var(--accent); transform:translateY(-4px); }
        .blog-tag { display:inline-block; background:rgba(0,240,255,0.1); color:var(--accent); padding:3px 10px; border-radius:999px; font-size:12px; margin-right:6px; }
        .blog-date { color:var(--text-muted); font-size:13px; margin-bottom:10px; }
        .blog-title { font-family:'Rajdhani',sans-serif; font-size:1.4rem; font-weight:600; margin-bottom:10px; }
        .blog-excerpt { color:var(--text-muted); font-size:14px; line-height:1.6; }
    </style>
</head>
<body>
    <header style="background:var(--bg-card); border-bottom:1px solid var(--border); padding:14px 20px;">
        <div style="max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center;">
            <a href="/trainerhub/" class="brand"><i class="fas fa-crosshairs"></i>Sweet<span>Cheat</span></a>
            <div style="display:flex; gap:12px;">
                <a href="dashboard" class="btn btn-primary btn-sm">Dashboard</a>
                <a href="login" class="btn btn-secondary btn-sm">Login</a>
            </div>
        </div>
    </header>

    <div style="max-width:1200px; margin:0 auto; padding:40px 20px;">
        <h1 style="font-family:'Rajdhani',sans-serif; font-size:2.2rem; margin-bottom:8px;">SweetCheat Blog</h1>
        <p style="color:var(--text-muted); margin-bottom:30px;">Guides, Neuigkeiten und Cheats rund um deine liebsten Singleplayer-Spiele.</p>

        <div id="blogGrid" class="blog-grid">
            <div class="card shimmer" style="height:220px;"></div>
            <div class="card shimmer" style="height:220px;"></div>
            <div class="card shimmer" style="height:220px;"></div>
        </div>
    </div>

    <footer style="background:var(--bg-card); border-top:1px solid var(--border); padding:30px; text-align:center; color:var(--text-muted); font-size:14px;">
        <p>© 2026 SweetCheat — Singleplayer-Trainer für PC-Spiele.</p>
    </footer>

    <script src="shared.js"></script>
    <script>
        async function loadBlog() {
            try {
                const res = await fetch('api/blog.php?action=list&per_page=50');
                const data = await res.json();
                const grid = document.getElementById('blogGrid');
                if (!data.success || !data.posts.length) {
                    grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:var(--text-muted); padding:40px;">Noch keine Beiträge.</div>';
                    return;
                }
                grid.innerHTML = data.posts.map(p => `
                    <a href="blog/${p.slug}" class="blog-card" style="text-decoration:none; color:inherit;">
                        <div class="blog-date">${new Date(p.created_at * 1000).toLocaleDateString('de-DE')}</div>
                        <div class="blog-title">${escapeHtml(p.title)}</div>
                        <div style="margin-bottom:12px;">${(p.tags || '').split(',').filter(t=>t).map(t => `<span class="blog-tag">${escapeHtml(t.trim())}</span>`).join('')}</div>
                        <div class="blog-excerpt">${escapeHtml(p.excerpt || p.content.slice(0, 150) + '...')}</div>
                    </a>
                `).join('');
            } catch(e) { console.error(e); }
        }
        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text || ''; return div.innerHTML; }
        loadBlog();
    </script>

<div id="chatWidget" class="chat-widget" style="position:fixed; bottom:90px; right:20px; width:340px; max-height:450px; background:var(--bg-card); border:1px solid var(--border); border-radius:16px; display:none; flex-direction:column; overflow:hidden; z-index:9998; box-shadow:0 20px 60px rgba(0,0,0,0.5);">
    <div style="padding:14px 16px; background:var(--bg-elevated); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
        <div style="font-weight:600; font-family: Rajdhani;"><i class="fas fa-comments" style="color:var(--accent); margin-right:8px;"></i>Community Chat</div>
        <button onclick="toggleChat()" style="background:none; border:none; color:var(--text-muted); cursor:pointer;"><i class="fas fa-times"></i></button>
    </div>
    <div id="chatMessages" style="flex:1; overflow-y:auto; padding:12px; max-height:320px;">
        <div class="empty" style="text-align:center; color:var(--text-muted);">Lade Chat...</div>
    </div>
    <div style="padding:12px; border-top:1px solid var(--border); display:flex; gap:8px;">
        <input type="text" id="chatInput" placeholder="Nachricht..." onkeydown="if(event.key==='Enter') sendChat()" style="flex:1; padding:8px 12px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:8px; color:var(--text);">
        <button class="btn btn-primary btn-sm" onclick="sendChat()"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>
<button id="chatToggle" class="btn btn-primary" onclick="toggleChat()" style="position:fixed; bottom:20px; right:20px; width:54px; height:54px; border-radius:50%; z-index:9999; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(0,212,255,0.3);"><i class="fas fa-comments fa-lg"></i></button>


<script>
    const token = getApiKey();
    let chatOpen = false;
    function toggleChat() {
        const w = document.getElementById('chatWidget');
        chatOpen = !chatOpen;
        w.style.display = chatOpen ? 'flex' : 'none';
        if (chatOpen) loadChat();
    }
    async function loadChat() {
        try {
            const res = await fetch('/trainerhub/api/chat.php?action=history');
            const data = await res.json();
            const container = document.getElementById('chatMessages');
            if (!data.success) { container.innerHTML = '<div class="empty" style="text-align:center; color:var(--text-muted);">Chat nicht verfügbar</div>'; return; }
            container.innerHTML = data.messages.map(m => `
                <div style="margin-bottom:8px;">
                    <span style="color:${m.is_admin ? 'var(--warning)' : 'var(--accent)'}; font-weight:600; font-size:0.85rem;">${m.username}</span>
                    <span style="color:var(--text-muted); font-size:0.75rem; margin-left:6px;">${new Date(m.created_at * 1000).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'})}</span>
                    <div style="color:var(--text); font-size:0.9rem; margin-top:2px;">${m.message}</div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        } catch(e) { console.error(e); }
    }
    async function sendChat() {
        if (!token) { showToast('Login erforderlich', 'warn'); return; }
        const input = document.getElementById('chatInput');
        const msg = input.value.trim();
        if (!msg) return;
        await fetch('/trainerhub/api/chat.php?action=send', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg })
        });
        input.value = '';
        loadChat();
    }
    setInterval(() => { if (chatOpen) loadChat(); }, 15000);
</script>
</body>
</html>
