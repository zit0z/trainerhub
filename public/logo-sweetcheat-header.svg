<svg xmlns="http://www.w3.org/2000/svg" width="600" height="160" viewBox="0 0 600 160">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a8cc;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Controller Icon -->
  <g transform="translate(10, 20)" filter="url(#glow)">
    <rect x="0" y="18" width="120" height="64" rx="28" ry="28" fill="url(#cyanGrad)" />
    <ellipse cx="22" cy="74" rx="20" ry="24" fill="url(#cyanGrad)" />
    <ellipse cx="98" cy="74" rx="20" ry="24" fill="url(#cyanGrad)" />

    <g fill="#0b0c10">
      <rect x="22" y="36" width="8" height="26" rx="2" />
      <rect x="15" y="43" width="22" height="8" rx="2" />
    </g>

    <circle cx="84" cy="36" r="6" fill="#7c3aed" />
    <circle cx="100" cy="52" r="6" fill="#2ed573" />
    <circle cx="68" cy="52" r="6" fill="#ff4757" />
    <circle cx="84" cy="68" r="6" fill="#ffa502" />

    <rect x="16" y="6" width="26" height="12" rx="4" fill="#00a8cc" />
    <rect x="80" y="6" width="26" height="12" rx="4" fill="#00a8cc" />
  </g>

  <text x="150" y="105" font-family="'Rajdhani', 'Arial Black', sans-serif" font-size="95" font-weight="700" letter-spacing="2">
    <tspan fill="#ffffff">Sweet</tspan><tspan fill="url(#cyanGrad)" filter="url(#glow)">Cheat</tspan>
  </text>
</svg>
