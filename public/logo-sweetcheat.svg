<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7b2cbf"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Controller icon -->
  <g transform="translate(20,20)" fill="none" stroke="url(#g1)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <rect x="0" y="24" width="120" height="72" rx="28" ry="28"/>
    <line x1="30" y1="48" x2="30" y2="72"/>
    <line x1="18" y1="60" x2="42" y2="60"/>
    <circle cx="86" cy="54" r="7" fill="#00d4ff" stroke="none"/>
    <circle cx="98" cy="70" r="7" fill="#7b2cbf" stroke="none"/>
  </g>

  <!-- Text -->
  <text x="160" y="72" font-family="Rajdhani, sans-serif" font-size="78" font-weight="700" fill="#f0f2f7" letter-spacing="1">Sweet</text>
  <text x="396" y="72" font-family="Rajdhani, sans-serif" font-size="78" font-weight="700" fill="url(#g1)" letter-spacing="1" filter="url(#glow)">Cheat</text>

  <!-- Tagline -->
  <text x="164" y="112" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#8b92a8" letter-spacing="3">MODS • TRAINER • TOOLS</text>
</svg>
